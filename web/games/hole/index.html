<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Sinkhole City</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../shared/fonts.css">
<link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"three":"../../lib/three.module.js","three/addons/":"../../lib/addons/"}}</script>
</head>
<body>
<canvas id="gl"></canvas>
<div id="vignette"></div>
<div id="touch"></div>
<div id="labels"></div>
<div id="popups"></div>
<div id="joy"><div class="ring"></div><div class="knob"></div></div>

<!-- HUD -->
<div id="hud" class="hidden">
  <button id="btnPause" class="roundbtn" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></button>
  <div id="timer"><svg viewBox="0 0 24 24" class="clock"><circle cx="12" cy="13" r="8.5" fill="#fff" stroke="#1d2a44" stroke-width="2.2"/><rect x="10" y="1.5" width="4" height="3" rx="1" fill="#1d2a44"/><path d="M12 13 L12 8.2" stroke="#ff4d4d" stroke-width="2.4" stroke-linecap="round"/><path d="M12 13 L15.2 14.8" stroke="#1d2a44" stroke-width="2.2" stroke-linecap="round"/></svg><span id="timeTxt">2:00</span></div>
  <div id="board"></div>
  <div id="myscore"><div class="lbl">SCORE</div><div id="scoreTxt">0</div></div>
  <div id="sizebar"><div class="ringwrap"><svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="18" class="bg"/><circle cx="22" cy="22" r="18" class="fg" id="sizeArc"/></svg><span id="lvlTxt">1</span></div><div class="sizelbl">SIZE</div></div>
  <div id="objective"><span class="oa"><svg viewBox="0 0 24 24"><path d="M12 2.5 3.5 20.5 12 16.2l8.5 4.3z"/></svg></span><span class="ot"></span><span class="od"></span></div>
  <div id="combo"></div>
  <div id="banner"></div>
  <div id="feed"></div>
  <div id="hint"><div class="hand"><svg viewBox="0 0 64 64"><path d="M26 30V12a4 4 0 0 1 8 0v14l10 2a5 5 0 0 1 4 5.6L46 50a6 6 0 0 1-6 5H30a6 6 0 0 1-4.8-2.4L16 40a3.6 3.6 0 0 1 5.4-4.7L26 40z" fill="#fff" stroke="#1d2a44" stroke-width="3" stroke-linejoin="round"/></svg></div><div class="txt">DRAG ANYWHERE TO MOVE</div></div>
  <div id="count"></div>
  <div id="respawn" class="hidden"><div class="t1">SWALLOWED!</div><div class="t2" id="respawnBy"></div><div class="t3">Respawning…</div></div>
</div>

<!-- MENU -->
<div id="menu" class="screen hidden">
  <div class="topbar">
    <button id="btnSettings" class="roundbtn" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm8.9 4.9-.9-.5a7.9 7.9 0 0 0 0-1.8l.9-.5a1 1 0 0 0 .4-1.3l-1.3-2.3a1 1 0 0 0-1.3-.4l-.9.5a7.8 7.8 0 0 0-1.6-.9V5.3a1 1 0 0 0-1-1h-2.6a1 1 0 0 0-1 1v1a7.8 7.8 0 0 0-1.6.9l-.9-.5a1 1 0 0 0-1.3.4L4.7 9.4a1 1 0 0 0 .4 1.3l.9.5a7.9 7.9 0 0 0 0 1.8l-.9.5a1 1 0 0 0-.4 1.3L6 17.1a1 1 0 0 0 1.3.4l.9-.5c.5.4 1 .7 1.6.9v1a1 1 0 0 0 1 1h2.6a1 1 0 0 0 1-1v-1c.6-.2 1.1-.5 1.6-.9l.9.5a1 1 0 0 0 1.3-.4l1.3-2.3a1 1 0 0 0-.4-1.3z"/></svg></button>
    <button id="btnHome" class="roundbtn" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M12 3.2 2.8 11a1 1 0 0 0 .7 1.8H5v7a1 1 0 0 0 1 1h4v-5h4v5h4a1 1 0 0 0 1-1v-7h1.5a1 1 0 0 0 .7-1.8z"/></svg></button>
    <div class="coins"><span class="coin"></span><span class="coinTxt">0</span></div>
  </div>
  <div class="logo">
    <div class="l1">SINKHOLE</div>
    <div class="l2">CITY</div>
    <div class="tag">Swallow everything. Grow. Rule the streets.</div>
  </div>
  <div class="menuBottom">
    <div id="mnGoals" class="goals"></div>
    <div class="best">BEST <b id="bestTxt">0</b> <span class="mapchip" id="mapChip">HARBOR CITY</span></div>
    <button id="btnPlay" class="bigbtn yellow">PLAY</button>
    <div class="row">
      <button id="btnSkins" class="bigbtn blue small"><span class="ico"></span>SKINS</button>
      <button id="btnMaps" class="bigbtn blue small"><span class="ico map"></span>MAPS</button>
    </div>
  </div>
</div>

<!-- SKINS -->
<div id="skins" class="screen hidden">
  <div class="panel">
    <div class="phead"><span>HOLE SKINS</span><div class="coins"><span class="coin"></span><span class="coinTxt">0</span></div></div>
    <div id="skinGrid"></div>
    <button id="btnSkinsBack" class="bigbtn yellow small">DONE</button>
  </div>
</div>

<!-- MAPS -->
<div id="maps" class="screen hidden">
  <div class="panel">
    <div class="phead"><span>MAPS</span><div class="coins"><span class="coin"></span><span class="coinTxt">0</span></div></div>
    <div id="mapGrid"></div>
    <button id="btnMapsBack" class="bigbtn yellow small">DONE</button>
  </div>
</div>

<!-- PAUSE / SETTINGS -->
<div id="pause" class="screen hidden">
  <div class="panel narrow">
    <div class="phead center"><span id="pauseTitle">PAUSED</span></div>
    <button id="btnResume" class="bigbtn yellow small">RESUME</button>
    <button id="btnSound" class="bigbtn blue small">SOUND: ON</button>
    <button id="btnQuality" class="bigbtn blue small">QUALITY: HIGH</button>
    <button id="btnQuit" class="bigbtn red small">QUIT TO MENU</button>
  </div>
</div>

<!-- RESULTS -->
<div id="over" class="screen hidden">
  <div class="panel results">
    <div class="rhead">ROUND OVER</div>
    <div class="rank"><div class="crown"></div><div id="rankTxt">#1</div><div id="rankSub">CHAMPION!</div></div>
    <div class="stars"><span class="star" id="st1"></span><span class="star" id="st2"></span><span class="star" id="st3"></span></div>
    <div id="standings"></div>
    <div class="stats">
      <div><b id="rsScore">0</b><span>SCORE</span></div>
      <div><b id="rsEaten">0</b><span>SWALLOWED</span></div>
      <div><b id="rsHoles">0</b><span>SET-PIECES</span></div>
      <div><b id="rsSize">0</b><span>MAX SIZE</span></div>
    </div>
    <div class="earn"><span class="coin"></span>+<b id="rsCoins">0</b></div>
    <div id="rsGoals" class="goals"></div>
    <div id="nextSkin"></div>
    <div class="row">
      <button id="btnMenu2" class="bigbtn blue small">HOME</button>
      <button id="btnAgain" class="bigbtn yellow small">PLAY AGAIN</button>
    </div>
  </div>
</div>

<div id="fade"></div>
<script type="module" src="main.js"></script>
</body>
</html>
