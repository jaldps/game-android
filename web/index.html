<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Clearplay Arcade</title>
<link rel="stylesheet" href="shared/fonts.css">
<style>
:root{--bg0:#120a2b;--bg1:#2a1460;--ink:#fff;--muted:#b9b0e6;--accent:#ffcf3a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:var(--bg0);color:var(--ink);font-family:'Nunito',sans-serif;overflow-x:hidden}
body{background:radial-gradient(120% 70% at 50% -10%,#5b2bd1 0%,var(--bg1) 40%,var(--bg0) 100%) fixed}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
header{position:relative;z-index:1;padding:calc(env(safe-area-inset-top) + 28px) 20px 10px;text-align:center}
h1{font-family:'Lilita One';font-weight:400;font-size:44px;line-height:.95;margin:0;letter-spacing:1px;
  background:linear-gradient(180deg,#fff 0%,#ffe27a 55%,#ffb21e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 #3b157f) drop-shadow(0 10px 18px rgba(0,0,0,.45))}
.tag{margin-top:10px;display:inline-flex;gap:8px;align-items:center;font-weight:900;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#1b0d3d;background:#5cf2ff;padding:6px 14px;border-radius:99px;box-shadow:0 3px 0 #1d8fa0}
main{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:18px 16px calc(env(safe-area-inset-bottom) + 28px);max-width:720px;margin:0 auto}
.card{position:relative;aspect-ratio:3/4;border-radius:24px;overflow:hidden;cursor:pointer;
  box-shadow:0 6px 0 rgba(0,0,0,.35),0 14px 30px rgba(0,0,0,.35),inset 0 0 0 2px rgba(255,255,255,.14);
  transform:translateY(20px) scale(.96);opacity:0;animation:pop .55s cubic-bezier(.2,1.4,.4,1) forwards;transition:transform .15s}
.card:active{transform:scale(.95)!important}
.card .art{position:absolute;inset:0;background-size:cover;background-position:center}
.card .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(10,4,30,.88) 100%)}
.card .info{position:absolute;left:14px;right:14px;bottom:12px}
.card h2{font-family:'Lilita One';font-weight:400;font-size:24px;margin:0;line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.45)}
.card p{margin:5px 0 0;font-size:12px;font-weight:800;color:#ddd6ff;line-height:1.2}
.card .best{position:absolute;top:10px;right:10px;font-weight:900;font-size:12px;background:rgba(0,0,0,.45);padding:4px 9px;border-radius:99px;backdrop-filter:blur(4px)}
.card .soon{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-family:'Lilita One';font-size:20px;background:rgba(15,8,40,.6);backdrop-filter:grayscale(1)}
.card.locked .soon{display:flex}
@keyframes pop{to{transform:none;opacity:1}}
footer{position:relative;z-index:1;text-align:center;color:var(--muted);font-weight:800;font-size:12px;padding-bottom:calc(env(safe-area-inset-bottom) + 18px);opacity:.8}
</style></head>
<body>
<canvas id="stars"></canvas>
<header><h1>CLEARPLAY<br>ARCADE</h1><div class="tag">✦ Zero ads · Zero waiting ✦</div></header>
<main id="grid"></main>
<footer>All games run offline. No ads, no tracking, no purchases.</footer>
<script>
const GAMES = [
  {id:'hole', title:'Sinkhole City', sub:'Swallow the city. Grow. Rule.', g:['#3ec7ff','#2a5bff']},
  {id:'crowd', title:'Mob Rush', sub:'Gather the biggest crowd in town.', g:['#ff6ad5','#7b2bff']},
  {id:'archer', title:'Bowbrawl', sub:'Aim, draw, headshot. Duel to the end.', g:['#ff9a3d','#d1225b']},
  {id:'downhill', title:'Ridgeline', sub:'Bomb the mountain. Beat the pack.', g:['#7be36b','#1f8a5b']},
  {id:'sled', title:'Frostline Dash', sub:'Swipe, dodge and sled forever.', g:['#9be7ff','#3a7bd5']},
  {id:'original', title:'???', sub:'An original game.', g:['#ffd36b','#8b4bff']},
];
const grid = document.getElementById('grid');
GAMES.forEach(async (g, i) => {
  const a = document.createElement('div'); a.className = 'card'; a.style.animationDelay = (i * 70) + 'ms';
  a.innerHTML = `<div class="art" style="background-image:linear-gradient(160deg,${g.g[0]},${g.g[1]})"></div><div class="shade"></div>
    <div class="info"><h2>${g.title}</h2><p>${g.sub}</p></div><div class="soon">Coming soon</div>`;
  grid.appendChild(a);
  let meta = null;
  try { meta = await (await fetch(`games/${g.id}/meta.json`, {cache:'no-store'})).json(); } catch (e) {}
  let ok = false; try { ok = (await fetch(`games/${g.id}/index.html`, {method:'GET', cache:'no-store'})).ok; } catch (e) {}
  if (meta) { if (meta.title) a.querySelector('h2').textContent = meta.title; if (meta.tagline) a.querySelector('p').textContent = meta.tagline;
    if (meta.thumb) a.querySelector('.art').style.backgroundImage = `url(games/${g.id}/${meta.thumb}), linear-gradient(160deg,${g.g[0]},${g.g[1]})`;
    if (meta.bestKey) { try { const b = localStorage.getItem(meta.bestKey); if (b) a.insertAdjacentHTML('beforeend', `<div class="best">★ ${b}</div>`); } catch (e) {} } }
  if (!ok) a.classList.add('locked');
  a.onclick = () => { if (ok) location.href = `games/${g.id}/index.html`; };
});
try { window.AndroidHost && AndroidHost.setOrientation('portrait'); } catch (e) {}
// twinkling starfield
const c = document.getElementById('stars'), x = c.getContext('2d'); let S = [];
function rs(){ c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio; S = Array.from({length:90}, () => ({x:Math.random()*c.width, y:Math.random()*c.height, r:(Math.random()*1.6+.4)*devicePixelRatio, p:Math.random()*6.28})); }
rs(); addEventListener('resize', rs);
(function f(t){ x.clearRect(0,0,c.width,c.height); for (const s of S){ x.globalAlpha = .35 + .35*Math.sin(t/700 + s.p); x.fillStyle = '#fff'; x.beginPath(); x.arc(s.x, s.y, s.r, 0, 7); x.fill(); } requestAnimationFrame(f); })(0);
</script>
</body></html>
